[workspace]
resolver = "2"
members = [
  "crates/rackio-core",
  "crates/rackio-protocol",
  "crates/rackio-iroh",
  "crates/rackio-windows-ipc",
  "apps/agent",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
prost = "0.14.4"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rand = "0.9.2"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
subtle = "2.6.1"
swarm-discovery = "=0.6.3"
sysinfo = { version = "=0.38.4", default-features = false, features = ["disk", "network", "system"] }
tauri = { version = "2.9.4", features = ["tray-icon"] }
tauri-build = "2.5.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "2.3.3"
thiserror = "2.0.17"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.dependencies.windows-sys]
version = "=0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
