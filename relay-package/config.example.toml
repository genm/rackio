enable_relay = true
http_bind_addr = "[::]:80"
enable_quic_addr_discovery = true
enable_metrics = true
metrics_bind_addr = "0.0.0.0:9090"

# Empty is intentionally fail-closed. Add the exact endpoint IDs of your nodes.
access.allowlist = []

[tls]
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7824"
cert_mode = "Manual"
manual_cert_path = "/certs/fullchain.pem"
manual_key_path = "/certs/privkey.pem"
