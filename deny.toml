[graph]
# Every target that a release actually ships. scripts/generate-third-party-licenses.sh
# derives cargo-about's target list from here, so an omission silently excludes a
# shipped target from both the advisory scan and the bundled license notices.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 enters only through gtk 0.18, which tauri, tauri-runtime, tauri-runtime-wry, tao, wry, muda and tray-icon each require independently on Linux; the fix exists only in glib 0.20, so no version bump removes it. The Linux desktop stays unpublished per docs/release-checklist.md; the headless agent archive has no glib in its graph. Tracked in https://github.com/genm/rackio/issues/14" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  # libfuzzer-sys bundles LLVM's compiler-rt under this permissive license; it
  # only ever reaches the detached fuzz/Cargo.lock (see #117).
  "NCSA",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
