# Rackio NAT laboratory topology.
#
# This file is the evidence artefact the release checklist asks for: every
# address, route and NAT rule a scenario depends on is declared here, so a
# report under test-results/nat-matrix/ can be reproduced from the checked-in
# topology alone.
#
#   lan_a         192.168.101.0/24  flat LAN, no router      (same-LAN direct)
#   lan_b         192.168.102.0/24  behind router-b          (monitored side)
#   lan_c         192.168.103.0/24  behind router-c          (viewer side)
#   lan_d         192.168.104.0/24  behind router-d          (cone, no forward)
#   lan_e         192.168.105.0/24  behind router-e          (cone, no forward)
#   lan_f         192.168.106.0/24  behind router-f          (symmetric)
#   lan_g         192.168.108.0/24  flat LAN with off-path services
#                                                            (direct-only isolation)
#
# The numbering skips 192.168.107.0/24 on purpose: Docker's default address pool
# hands that block out to unrelated compose projects on a developer machine, and
# `docker network create` refuses an overlapping pool, so the lab would fail to
# come up for a reason that has nothing to do with Rackio. It was observed doing
# exactly that while `lan_g` was added. Any of these blocks can collide the same
# way; a collision is a `Pool overlaps with other one on this address space`
# error from `lab_up`, and the fix is to renumber the offending network here.
#   net_internet  192.0.2.0/24      shared "internet" segment, and the relay
#
# 192.0.2.0/24 is RFC 5737 TEST-NET-1. It is deliberately *not* an RFC 1918
# range, so a path across it is classified `wan_direct` by the agent rather
# than `lan_direct`, which is what a real WAN path must report.
#
# Every network is `internal`, so a lab machine physically cannot reach
# anything outside the topology. Direct-only mode is then proven by the
# topology, not only by configuration. The relay at 192.0.2.4 is the single
# exception to "no third party on the wire", and only the relay scenarios
# configure a machine to use it.
#
# The relay's configuration is rendered by the runner into
# test-results/nat-matrix/relay/config.toml rather than checked in, because the
# fail-closed `access.allowlist` the production package documents can only be
# written once the lab machines' endpoint IDs exist. Every relay report embeds
# the exact rendered file, so a relay run stays reproducible from the report
# plus this topology.

name: rackio-nat-lab

x-machine: &machine
  image: rackio-nat-lab-agent:local
  init: true
  # NET_ADMIN installs the route to the NAT router; NET_RAW lets tcpdump
  # capture on the LAN interface.
  cap_add:
    - NET_ADMIN
    - NET_RAW
  security_opt:
    - no-new-privileges:true
  environment:
    RUST_LOG: info

x-router: &router
  image: rackio-nat-lab-router:local
  init: true
  cap_add:
    - NET_ADMIN
    - NET_RAW
  sysctls:
    net.ipv4.ip_forward: "1"

services:
  # --- Flat LAN: same-LAN direct and address change -------------------------
  lan-a-viewer:
    <<: *machine
    container_name: rackio-nat-lab-lan-a-viewer
    hostname: viewer-a.lab.test
    networks:
      lan_a:
        ipv4_address: 192.168.101.10

  lan-a-monitored:
    <<: *machine
    container_name: rackio-nat-lab-lan-a-monitored
    hostname: monitored-a.lab.test
    networks:
      lan_a:
        ipv4_address: 192.168.101.11

  # --- Two NATed LANs: port-forwarded direct --------------------------------
  router-b:
    <<: *router
    container_name: rackio-nat-lab-router-b
    hostname: router-b.lab.test
    environment:
      NAT_MODE: endpoint_independent
      NAT_LAN_SUBNET: 192.168.102.0/24
      NAT_WAN_SUBNET: 192.0.2.0/24
      # The operator's port forward: the monitored machine's fixed listen port
      # (`rackio listen-port set 41641`) published on the router's WAN address.
      NAT_PORT_FORWARDS: udp:41641:192.168.102.10:41641
    networks:
      lan_b:
        ipv4_address: 192.168.102.2
      net_internet:
        ipv4_address: 192.0.2.2

  router-c:
    <<: *router
    container_name: rackio-nat-lab-router-c
    hostname: router-c.lab.test
    environment:
      NAT_MODE: endpoint_independent
      NAT_LAN_SUBNET: 192.168.103.0/24
      NAT_WAN_SUBNET: 192.0.2.0/24
    networks:
      lan_c:
        ipv4_address: 192.168.103.2
      net_internet:
        ipv4_address: 192.0.2.3

  lan-b-monitored:
    <<: *machine
    container_name: rackio-nat-lab-lan-b-monitored
    hostname: monitored-b.lab.test
    environment:
      RUST_LOG: info
      LAB_DEFAULT_GATEWAY: 192.168.102.2
    depends_on:
      - router-b
    networks:
      lan_b:
        ipv4_address: 192.168.102.10

  lan-c-viewer:
    <<: *machine
    container_name: rackio-nat-lab-lan-c-viewer
    hostname: viewer-c.lab.test
    environment:
      RUST_LOG: info
      LAB_DEFAULT_GATEWAY: 192.168.103.2
    depends_on:
      - router-c
    networks:
      lan_c:
        ipv4_address: 192.168.103.10

  # --- Self-hosted relay -----------------------------------------------------
  #
  # The image is `relay-package/` built unchanged: upstream `iroh-relay` pinned
  # to 1.0.3. Only its configuration differs from the production package, and
  # the difference is recorded in every relay report and in README.md.
  relay:
    image: rackio-nat-lab-relay:local
    container_name: rackio-nat-lab-relay
    hostname: relay.lab.test
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The relay runs as 65532 and still serves the documented port 80.
      - NET_BIND_SERVICE
    volumes:
      - "../../test-results/nat-matrix/relay:/etc/iroh-relay:ro"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      net_internet:
        ipv4_address: 192.0.2.4

  # --- Cone NAT on both sides, no port forward anywhere ----------------------
  #
  # This is the pair `cone_nat_hole_punch` uses. Neither router has a DNAT rule,
  # so a direct path between these two machines can only exist because both
  # sides punched one open.
  router-d:
    <<: *router
    container_name: rackio-nat-lab-router-d
    hostname: router-d.lab.test
    environment:
      NAT_MODE: endpoint_independent
      NAT_LAN_SUBNET: 192.168.104.0/24
      NAT_WAN_SUBNET: 192.0.2.0/24
    networks:
      lan_d:
        ipv4_address: 192.168.104.2
      net_internet:
        ipv4_address: 192.0.2.5

  router-e:
    <<: *router
    container_name: rackio-nat-lab-router-e
    hostname: router-e.lab.test
    environment:
      NAT_MODE: endpoint_independent
      NAT_LAN_SUBNET: 192.168.105.0/24
      NAT_WAN_SUBNET: 192.0.2.0/24
    networks:
      lan_e:
        ipv4_address: 192.168.105.2
      net_internet:
        ipv4_address: 192.0.2.6

  # --- Symmetric NAT on the monitored side -----------------------------------
  #
  # Identical to router-d apart from `NAT_MODE`, so the relay-fallback scenario
  # differs from the hole-punching scenario in the NAT's mapping behaviour and
  # in nothing else.
  router-f:
    <<: *router
    container_name: rackio-nat-lab-router-f
    hostname: router-f.lab.test
    environment:
      NAT_MODE: symmetric
      NAT_LAN_SUBNET: 192.168.106.0/24
      NAT_WAN_SUBNET: 192.0.2.0/24
    networks:
      lan_f:
        ipv4_address: 192.168.106.2
      net_internet:
        ipv4_address: 192.0.2.7

  lan-d-monitored:
    <<: *machine
    container_name: rackio-nat-lab-lan-d-monitored
    hostname: monitored-d.lab.test
    environment:
      RUST_LOG: info
      LAB_DEFAULT_GATEWAY: 192.168.104.2
    depends_on:
      - router-d
    networks:
      lan_d:
        ipv4_address: 192.168.104.10

  lan-e-viewer:
    <<: *machine
    container_name: rackio-nat-lab-lan-e-viewer
    hostname: viewer-e.lab.test
    environment:
      RUST_LOG: info
      LAB_DEFAULT_GATEWAY: 192.168.105.2
    depends_on:
      - router-e
    networks:
      lan_e:
        ipv4_address: 192.168.105.10

  lan-f-monitored:
    <<: *machine
    container_name: rackio-nat-lab-lan-f-monitored
    hostname: monitored-f.lab.test
    environment:
      RUST_LOG: info
      LAB_DEFAULT_GATEWAY: 192.168.106.2
    depends_on:
      - router-f
    networks:
      lan_f:
        ipv4_address: 192.168.106.10

  # --- Direct-only isolation: a LAN that is not empty ------------------------
  #
  # A flat LAN like `lan_a`, plus the two things a leaking daemon would most
  # plausibly reach: a DNS resolver and an HTTP server. Both are reachable from
  # the machines, and `direct_only_isolation` proves that from the monitored
  # machine itself before and after its capture window. Without them, "the
  # daemon contacted no resolver and no web server" would only say that the LAN
  # had none.
  #
  # Both machines are pointed at the lab resolver with `LAB_RESOLVER`, so any
  # DNS they did emit would be a packet on this LAN rather than a query to
  # Docker's embedded resolver on loopback, where the capture could not see it.
  lan-g-viewer:
    <<: *machine
    container_name: rackio-nat-lab-lan-g-viewer
    hostname: viewer-g.lab.test
    environment:
      RUST_LOG: info
      LAB_RESOLVER: 192.168.108.20
    depends_on:
      - lan-g-resolver
    networks:
      lan_g:
        ipv4_address: 192.168.108.10

  lan-g-monitored:
    <<: *machine
    container_name: rackio-nat-lab-lan-g-monitored
    hostname: monitored-g.lab.test
    environment:
      RUST_LOG: info
      LAB_RESOLVER: 192.168.108.20
    depends_on:
      - lan-g-resolver
    networks:
      lan_g:
        ipv4_address: 192.168.108.11

  lan-g-resolver:
    image: rackio-nat-lab-services:local
    container_name: rackio-nat-lab-lan-g-resolver
    hostname: resolver-g.lab.test
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      LAB_SERVICE_ROLE: resolver
      LAB_HTTP_ADDRESS: 192.168.108.21
      LAB_MONITORED_ADDRESS: 192.168.108.11
      LAB_VIEWER_ADDRESS: 192.168.108.10
    healthcheck:
      # `-type=a`: the lab's names have A records and no AAAA, and busybox
      # nslookup exits non-zero on the empty AAAA answer even though the
      # resolver is working exactly as configured.
      test: ["CMD", "busybox", "nslookup", "-type=a", "http.lab.test", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks:
      lan_g:
        ipv4_address: 192.168.108.20

  lan-g-http:
    image: rackio-nat-lab-services:local
    container_name: rackio-nat-lab-lan-g-http
    hostname: http-g.lab.test
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      LAB_SERVICE_ROLE: http
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks:
      lan_g:
        ipv4_address: 192.168.108.21

networks:
  lan_a:
    internal: true
    ipam:
      config:
        - subnet: 192.168.101.0/24
  lan_b:
    internal: true
    ipam:
      config:
        - subnet: 192.168.102.0/24
  lan_c:
    internal: true
    ipam:
      config:
        - subnet: 192.168.103.0/24
  lan_d:
    internal: true
    ipam:
      config:
        - subnet: 192.168.104.0/24
  lan_e:
    internal: true
    ipam:
      config:
        - subnet: 192.168.105.0/24
  lan_f:
    internal: true
    ipam:
      config:
        - subnet: 192.168.106.0/24
  lan_g:
    internal: true
    ipam:
      config:
        - subnet: 192.168.108.0/24
  net_internet:
    internal: true
    ipam:
      config:
        - subnet: 192.0.2.0/24
