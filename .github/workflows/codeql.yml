name: CodeQL

# Semantic dataflow analysis, which is the one class of finding the existing
# gates cannot produce: clippy reasons about a single function, cargo-deny about
# the dependency graph, and the tracked source scans about literal text. CodeQL
# follows attacker-controlled values across crate and module boundaries.
#
# Deliberately not routed through scripts/ci-plan.mjs. Code scanning results are
# per-commit repository state rather than a pass/fail gate for one diff, and a
# skipped analysis would silently age out the alerts shown for the branch.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Offset from the Monday Security run so a new query release is picked up on
    # its own runner rather than contending with the full-history secret scan.
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # Required so the analysis can correlate results with the run that
      # produced them; without it CodeQL cannot upload for the pull request.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Every language CodeQL supports without a build for this repository.
        # `actions` overlaps zizmor only partially: zizmor audits workflow
        # structure, CodeQL follows expression data into shell.
        language: [rust, javascript-typescript, actions]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # `security-extended` costs analysis time this repository has for free
          # and adds the lower-severity queries the default suite omits.
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
