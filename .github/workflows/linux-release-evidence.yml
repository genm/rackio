name: Linux release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require the protected default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_REF: ${{ github.ref }}
          REQUESTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$REQUESTED_REF_TYPE" != "branch" || "$REQUESTED_REF" != "$expected_ref" ]]; then
            echo "release evidence must be built from the protected default branch" >&2
            exit 1
          fi

  artifacts:
    name: Linux release artifacts
    needs: guard
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/linux-release-artifacts.yml
