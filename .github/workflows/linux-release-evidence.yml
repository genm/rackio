name: Linux release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Require the protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_REF: ${{ github.ref_name }}
        run: |
          if [[ "$REQUESTED_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "release evidence must be built from the protected default branch" >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
      - name: Resolve package version
        id: package
        run: |
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq --raw-output '.packages[] | select(.name == "rackio-agent") | .version'
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "rackio-agent has no release-safe package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build headless agent
        run: cargo build --locked --release -p rackio-agent --target "${{ matrix.target }}"
      - name: Reject vendor networking defaults
        env:
          RACKIO_RELEASE_REPORT: test-results/release-binary-${{ matrix.target }}.json
        run: scripts/check-release-binary-cloud-independence.sh "target/${{ matrix.target }}/release/rackio"
      - name: Package and verify release archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          archive="$(
            packaging/linux/package-release.sh \
              "target/$TARGET/release/rackio" \
              "$VERSION" \
              "$TARGET"
          )"
          (
            cd dist
            sha256sum --check "$(basename "$archive").sha256"
          )
          tar -tzf "$archive" | LC_ALL=C sort > test-results/archive-members.txt
          LC_ALL=C sort > test-results/expected-archive-members.txt <<'EOF'
          LICENSE-APACHE
          LICENSE-MIT
          THIRDPARTY.html
          rackio
          rackio.service
          uninstall.sh
          EOF
          diff -u test-results/expected-archive-members.txt test-results/archive-members.txt
          jq --null-input \
            --arg target "$TARGET" \
            --arg version "$VERSION" \
            --arg archive "$(basename "$archive")" \
            '{ok: true, target: $target, version: $version, archive: $archive, checksum: true, layout: true}' \
            > "test-results/linux-release-$TARGET.json"
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.tar.gz
      - name: Upload short-lived evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.target }}
          path: |
            dist/
            test-results/
          retention-days: 1
          compression-level: 0
