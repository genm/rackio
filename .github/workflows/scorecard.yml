name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain posture rather than its
# code: branch protection, action pinning, dependency update automation, fuzzing,
# a published security policy, signed releases. That is the one thing an outside
# contributor or packager cannot check for themselves from a clone, so the
# result is published rather than kept as a local report.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Wednesday, clear of the Monday Security and Sunday Deep verification runs.
    - cron: "11 6 * * 3"

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze supply-chain posture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploading the result as a code-scanning report is what makes a
      # regression visible in the Security tab instead of only in a badge.
      security-events: write
      # Required for the signed, publishable result.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing is what lets the README badge and the public API report a
          # score at all; without it the result stays inside this repository.
          publish_results: true
      - name: Upload the raw result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5
      - name: Report findings in the Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
