name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Check Rust advisories, licenses and sources
        run: cargo deny check
      - name: Check unused Rust dependencies
        run: cargo machete
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high
      - name: Scan source and lockfiles
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: tray-monitor.cdx.json
          exit-code: "0"
      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tray-monitor-sbom
          path: tray-monitor.cdx.json
          retention-days: 7
      - name: Reject upstream relay or discovery defaults in application source
        run: |
          if rg --glob '!docs/**' --glob '!README.md' \
            'presets::N0|RelayMode::Default|dns_discovery|PortmapperConfig::Enabled' \
            crates apps; then
            echo "vendor networking default found in application source" >&2
            exit 1
          fi
      - name: Verify secret terms are absent from structured-log fields
        run: |
          if rg 'tracing::[a-z]+!.*(one_time_secret|private_key|metric_sample)' crates apps; then
            echo "sensitive structured-log field found" >&2
            exit 1
          fi
