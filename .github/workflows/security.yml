name: Security

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP:?}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP:?}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        run: |
          mkdir -p test-results
          gitleaks git . --redact=100 --report-format json \
            --report-path test-results/gitleaks.json --exit-code 1 --no-banner
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Install Rust policy tools
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-about@0.9.1
          fallback: none
      - name: Check Rust advisories, licenses and sources
        run: cargo deny check
      - name: Verify bundled third-party license notices
        run: |
          scripts/generate-third-party-licenses.sh /tmp/rackio-THIRDPARTY.html
          cmp THIRDPARTY.html /tmp/rackio-THIRDPARTY.html
      - name: Check unused Rust dependencies
        run: cargo machete
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify bundled JavaScript license notices
        run: |
          node scripts/generate-javascript-licenses.mjs /tmp/rackio-THIRDPARTY-JAVASCRIPT.html
          cmp THIRDPARTY-JAVASCRIPT.html /tmp/rackio-THIRDPARTY-JAVASCRIPT.html
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high
      - name: Scan source and lockfiles
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: rackio.cdx.json
          exit-code: "0"
      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rackio-sbom
          path: rackio.cdx.json
          retention-days: 7
      - name: Reject upstream relay or discovery defaults in application source
        run: |
          if rg --glob '!docs/**' --glob '!README.md' \
            'presets::N0|RelayMode::Default|dns_discovery|PortmapperConfig::Enabled' \
            crates apps; then
            echo "vendor networking default found in application source" >&2
            exit 1
          fi
      - name: Verify secret terms are absent from structured-log fields
        run: |
          if rg 'tracing::[a-z]+!.*(one_time_secret|private_key|metric_sample)' crates apps; then
            echo "sensitive structured-log field found" >&2
            exit 1
          fi
