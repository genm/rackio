name: Security

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A push to main must not cancel the in-flight scheduled full-history scan,
  # which is the only run that is not limited to an affected range.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan affected security checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      security_policy: ${{ steps.plan.outputs.security_policy }}
      security_source: ${{ steps.plan.outputs.security_source }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted pull request planner
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          persist-credentials: false
      - name: Select affected gates
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_ACTION: ${{ github.event.action }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          planner="scripts/ci-plan.mjs"
          # A script-only PR change must not choose which gates may become no-ops.
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            planner=".ci-trusted-base/scripts/ci-plan.mjs"
          fi
          node "$planner"

  dependency-policy:
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_SECURITY_POLICY: >-
        ${{
          needs.plan.result != 'success' ||
          needs.plan.outputs.security_policy != 'false'
        }}
      RUN_SECURITY_SOURCE: >-
        ${{
          needs.plan.result != 'success' ||
          needs.plan.outputs.security_source != 'false'
        }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP:?}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP:?}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan affected Git history for secrets
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p test-results
          log_options=()
          if [[ "${{ github.event_name }}" != "schedule" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            log_options=(--log-opts="$BASE_SHA...$HEAD_SHA")
          fi
          gitleaks git . "${log_options[@]}" --redact=100 --report-format json \
            --report-path test-results/gitleaks.json --exit-code 1 --no-banner
      - name: Select pinned Rust toolchain
        if: env.RUN_SECURITY_POLICY == 'true'
        run: rustup show
      - name: Install Rust policy tools
        if: env.RUN_SECURITY_POLICY == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-about@0.9.1
          fallback: none
      - name: Check Rust advisories, licenses and sources
        if: env.RUN_SECURITY_POLICY == 'true'
        run: cargo deny check
      - name: Verify bundled third-party license notices
        if: env.RUN_SECURITY_POLICY == 'true'
        run: |
          scripts/generate-third-party-licenses.sh /tmp/rackio-THIRDPARTY.html
          cmp THIRDPARTY.html /tmp/rackio-THIRDPARTY.html
      - name: Check unused Rust dependencies
        if: env.RUN_SECURITY_POLICY == 'true'
        run: cargo machete
      - name: Set up Node
        if: env.RUN_SECURITY_POLICY == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Activate pinned pnpm
        if: env.RUN_SECURITY_POLICY == 'true'
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        if: env.RUN_SECURITY_POLICY == 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate Dependabot configuration
        if: env.RUN_SECURITY_POLICY == 'true'
        run: pnpm test:dependabot-config
      - name: Verify bundled JavaScript license notices
        if: env.RUN_SECURITY_POLICY == 'true'
        run: |
          node scripts/generate-javascript-licenses.mjs /tmp/rackio-THIRDPARTY-JAVASCRIPT.html
          cmp THIRDPARTY-JAVASCRIPT.html /tmp/rackio-THIRDPARTY-JAVASCRIPT.html
      - name: Audit JavaScript dependencies
        if: env.RUN_SECURITY_POLICY == 'true'
        run: pnpm audit --audit-level=high
      - name: Scan source and lockfiles
        if: env.RUN_SECURITY_POLICY == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request' && env.RUN_SECURITY_POLICY == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: rackio.cdx.json
          exit-code: "0"
      - name: Upload SBOM
        if: github.event_name != 'pull_request' && env.RUN_SECURITY_POLICY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rackio-sbom
          path: rackio.cdx.json
          retention-days: 7
      - name: Reject upstream relay or discovery defaults in application source
        if: env.RUN_SECURITY_SOURCE == 'true'
        run: |
          source scripts/reject-matches.sh
          rackio_reject_matches \
            "vendor networking default found in application source" \
            "tracked vendor-networking source scan" \
            git grep -n -E \
            'presets::N0|RelayMode::Default|dns_discovery|PortmapperConfig::Enabled' \
            -- crates apps
      - name: Verify secret terms are absent from structured-log fields
        if: env.RUN_SECURITY_SOURCE == 'true'
        run: |
          source scripts/reject-matches.sh
          rackio_reject_matches \
            "sensitive structured-log field found" \
            "tracked structured-log source scan" \
            git grep -n -E \
            'tracing::[a-z]+!.*(one_time_secret|private_key|metric_sample)' \
            -- crates apps
