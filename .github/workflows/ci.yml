name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ROOT_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            git show --no-patch --format=%B "$ROOT_SHA" | pnpm commitlint
            if [[ "$ROOT_SHA" != "$HEAD_SHA" ]]; then
              pnpm commitlint --from "$ROOT_SHA" --to "$HEAD_SHA" --verbose
            fi
          else
            pnpm commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Install nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo nextest run --workspace
      - name: Exercise two-daemon pairing and reconnect
        if: runner.os == 'Linux'
        run: scripts/test-two-daemon-pairing.sh
      - name: Exercise secured named-pipe IPC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @(
            "scripts/test-windows-named-pipe.ps1",
            "packaging/windows/install.ps1",
            "packaging/windows/uninstall.ps1",
            "packaging/windows/package-release.ps1"
          ) | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_))
          }
          scripts/test-windows-named-pipe.ps1
      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test-results
          cargo metadata --format-version=1 > test-results/cargo-metadata.json
          git status --short > test-results/git-status.txt
          cp target/nextest/default/test-results/nextest/junit.xml test-results/junit.xml || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-${{ matrix.os }}-failure
          path: test-results/
          retention-days: 3

  frontend:
    name: Frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install component-test browser
        run: pnpm --filter @rackio/desktop exec playwright install --with-deps chromium
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Environment contract tests
        run: pnpm test:env
      - name: Component tests
        run: pnpm test:ct
      - name: Production build
        run: pnpm build
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-failure
          path: |
            test-results/
            output/playwright/
          retention-days: 3
