name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseding a pull-request run is free; cancelling a protected-branch run
  # would leave that commit without completed gate evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan affected checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      rust_linux: ${{ steps.plan.outputs.rust_linux }}
      rust_macos: ${{ steps.plan.outputs.rust_macos }}
      rust_windows: ${{ steps.plan.outputs.rust_windows }}
      frontend: ${{ steps.plan.outputs.frontend }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted pull request planner
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          persist-credentials: false
      - name: Select affected gates
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_ACTION: ${{ github.event.action }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          planner="scripts/ci-plan.mjs"
          # A script-only PR change must not choose which gates may become no-ops.
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            planner=".ci-trusted-base/scripts/ci-plan.mjs"
          fi
          node "$planner"

  hygiene:
    name: Repository hygiene
    # Deliberately outside the affected plan. These three checks read the whole
    # repository in seconds without a build, so narrowing them would cost more
    # planner surface than it saves runner time — and workflow linting must not
    # depend on a gate that a workflow-only change can route around.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP:?}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP:?}/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Install pinned workflow and spelling auditors
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: zizmor@1.28.0,typos@1.48.0
          fallback: none
      - name: Validate GitHub Actions workflow syntax
        run: actionlint
      - name: Audit GitHub Actions workflow security
        env:
          # Online mode resolves every pinned action hash back to its tag, which
          # is what detects a hash whose version comment no longer matches the
          # ref it claims — the failure mode a rewritten upstream tag produces.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/
      - name: Check spelling
        run: typos

  commits:
    name: Conventional Commits
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ROOT_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            git show --no-patch --format=%B "$ROOT_SHA" | pnpm commitlint
            if [[ "$ROOT_SHA" != "$HEAD_SHA" ]]; then
              pnpm commitlint --from "$ROOT_SHA" --to "$HEAD_SHA" --verbose
            fi
          else
            pnpm commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi
      - name: Validate contributor governance metadata
        run: pnpm test:governance

  rust:
    name: Rust (${{ matrix.os }})
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUN_RUST: >-
        ${{
          needs.plan.result != 'success' ||
          (matrix.os == 'ubuntu-24.04' && needs.plan.outputs.rust_linux != 'false') ||
          (matrix.os == 'macos-15' && needs.plan.outputs.rust_macos != 'false') ||
          (matrix.os == 'windows-2022' && needs.plan.outputs.rust_windows != 'false')
        }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Report unaffected Rust gate
        if: env.RUN_RUST != 'true'
        run: echo "No Rust-owned files changed; required context satisfied without heavy work."
      - name: Check out source
        if: env.RUN_RUST == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        if: env.RUN_RUST == 'true'
        run: rustup show
      - name: Cache cargo registry and dependency build output
        if: env.RUN_RUST == 'true'
        # Swatinem/rust-cache caches the registry plus the *dependency* portion
        # of target/ and deliberately excludes this workspace's own crate
        # output, which changes on every commit and is cheap to rebuild
        # incrementally. Caching the whole target/ tree here is what pushed
        # the repository over the 10 GB Actions cache limit (#114); the
        # rustc host triple and this job's id already separate the matrix
        # entries, and `key` adds the OS explicitly for clarity.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - name: Validate Windows PowerShell syntax
        if: env.RUN_RUST == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          @(
            "scripts/test-windows-named-pipe.ps1",
            "packaging/windows/install.ps1",
            "packaging/windows/uninstall.ps1",
            "packaging/windows/package-release.ps1"
          ) | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_))
          }
      - name: Install Linux desktop libraries
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        env:
          # Without a TTY, a package's postinst debconf prompt blocks forever
          # instead of failing, which no timeout/retry budget below can outlast.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Same hardening as the mingw-w64 install in rust-windows-cross-check:
          # azure.archive.ubuntu.com occasionally stalls a request instead of
          # failing it, and unhardened apt has no timeout to notice. See that
          # job's step for the full rationale.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          attempt=1
          max_attempts=3
          until sudo timeout 60s apt-get "${apt_opts[@]}" update \
            && sudo timeout 120s apt-get "${apt_opts[@]}" install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::apt-get update/install of Linux desktop libraries failed after ${max_attempts} attempts"
              exit 1
            fi
            backoff=$((attempt * 10))
            echo "apt-get attempt ${attempt}/${max_attempts} failed or timed out; retrying in ${backoff}s..."
            sleep "$backoff"
            attempt=$((attempt + 1))
          done
      - name: Install nextest
        if: env.RUN_RUST == 'true'
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - name: Format
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: env.RUN_RUST == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        env:
          # A broken intra-doc link or invalid doc attribute is a silent
          # documentation regression that `cargo doc` otherwise only warns about.
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Test
        if: env.RUN_RUST == 'true'
        run: cargo nextest run --workspace
      - name: Check the fuzz targets
        # The fuzz crate is built by the scheduled deep-verification run on
        # nightly. Type-checking it here on stable means a refactor that breaks
        # a target fails on the pull request that caused it, not a week later.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - name: Exercise two-daemon pairing and reconnect
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: scripts/test-two-daemon-pairing.sh
      - name: Exercise monitored address change and recovery
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: scripts/test-two-daemon-address-change.sh
      - name: Verify the rootless Linux installer contract
        # The installer ships to Linux but this test only ever ran on a
        # developer's macOS host through `mise run check`, which is how a
        # `shasum`-only call survived in it. The Linux leg owns `install.sh` and
        # `packaging/linux/**` already, so the platform it targets is also the
        # platform that proves it.
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: packaging/linux/install.test.sh
      - name: Exercise secured named-pipe IPC
        if: env.RUN_RUST == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-windows-named-pipe.ps1
      - name: Capture failure diagnostics
        if: env.RUN_RUST == 'true' && failure()
        shell: bash
        run: |
          mkdir -p test-results
          cargo metadata --format-version=1 > test-results/cargo-metadata.json
          git status --short > test-results/git-status.txt
          cp target/nextest/default/test-results/nextest/junit.xml test-results/junit.xml || true
      - name: Upload failure diagnostics
        if: env.RUN_RUST == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-${{ matrix.os }}-failure
          path: test-results/
          retention-days: 3

  rust-windows-cross-check:
    name: Rust Windows cross-compile check
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_RUST_WINDOWS_CROSS: >-
        ${{
          needs.plan.result != 'success' ||
          needs.plan.outputs.rust_windows != 'false'
        }}
    steps:
      - name: Report unaffected Windows cross-compile gate
        if: env.RUN_RUST_WINDOWS_CROSS != 'true'
        run: echo "No Windows-relevant files changed; required context satisfied without heavy work."
      - name: Check out source
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        run: rustup show
      - name: Cache cargo registry and dependency build output
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        # See the equivalent step in the `rust` job for why this replaces a
        # whole-target/ cache (#114).
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-gnu-cross
      - name: Install Windows GNU cross-compile target and linker
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        env:
          # Without a TTY, a package's postinst debconf prompt blocks forever
          # instead of failing, which no timeout/retry budget below can outlast.
          DEBIAN_FRONTEND: noninteractive
        run: |
          rustup target add x86_64-pc-windows-gnu
          # azure.archive.ubuntu.com is the default package mirror on GitHub's
          # Azure-hosted runners and occasionally accepts a connection and then
          # never sends data. apt has no timeout for a stalled transfer by
          # default, so a bad mirror backend hangs until the job's 15-minute
          # timeout kills the whole runner with no diagnostic in the log.
          # Acquire::http::Timeout/Acquire::https::Timeout/Acquire::Retries
          # give apt a short per-request ceiling so a stalled file fails fast
          # and retries onto a (likely different, healthy) backend behind the
          # mirror's round-robin DNS. The outer `timeout` + attempt loop is a
          # hard backstop for whatever those options can't cover (e.g. apt
          # itself wedging), bounding this step to well under the job's
          # timeout even in a genuine mirror outage, with a clear error in
          # the log instead of a silent kill.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          attempt=1
          max_attempts=3
          until sudo timeout 60s apt-get "${apt_opts[@]}" update \
            && sudo timeout 120s apt-get "${apt_opts[@]}" install --yes mingw-w64; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::apt-get update/install of mingw-w64 failed after ${max_attempts} attempts"
              exit 1
            fi
            backoff=$((attempt * 10))
            echo "apt-get attempt ${attempt}/${max_attempts} failed or timed out; retrying in ${backoff}s..."
            sleep "$backoff"
            attempt=$((attempt + 1))
          done
      # Every crate whose `cfg(windows)` branches would otherwise compile only
      # on the Windows runner. `rackio-desktop` is excluded because Tauri needs
      # a Windows webview SDK that cannot be cross-linked from Linux; the
      # Windows leg remains its only gate.
      - name: Check the Windows-owned crates for the Windows GNU target
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        run: >-
          cargo check --target x86_64-pc-windows-gnu --all-features
          -p rackio-windows-ipc -p rackio-core -p rackio-protocol
          -p rackio-iroh -p rackio-agent
      - name: Clippy the Windows-owned crates for the Windows GNU target
        if: env.RUN_RUST_WINDOWS_CROSS == 'true'
        run: >-
          cargo clippy --target x86_64-pc-windows-gnu --all-targets --all-features
          -p rackio-windows-ipc -p rackio-core -p rackio-protocol
          -p rackio-iroh -p rackio-agent -- -D warnings

  frontend:
    name: Frontend
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_FRONTEND: >-
        ${{
          needs.plan.result != 'success' ||
          needs.plan.outputs.frontend != 'false'
        }}
    steps:
      - name: Report unaffected frontend gate
        if: env.RUN_FRONTEND != 'true'
        run: echo "No frontend-owned files changed; required context satisfied without heavy work."
      - name: Check out source
        if: env.RUN_FRONTEND == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: env.RUN_FRONTEND == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Activate pinned pnpm
        if: env.RUN_FRONTEND == 'true'
        run: |
          corepack enable
          corepack install
      - name: Resolve pnpm store path
        if: env.RUN_FRONTEND == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        if: env.RUN_FRONTEND == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        if: env.RUN_FRONTEND == 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        if: env.RUN_FRONTEND == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install component-test browser
        if: env.RUN_FRONTEND == 'true'
        run: pnpm --filter @rackio/desktop exec playwright install --with-deps chromium
      - name: Format
        if: env.RUN_FRONTEND == 'true'
        run: pnpm format:check
      - name: Typecheck
        if: env.RUN_FRONTEND == 'true'
        run: pnpm typecheck
      - name: Lint
        if: env.RUN_FRONTEND == 'true'
        run: pnpm lint
      - name: Unit tests
        if: env.RUN_FRONTEND == 'true'
        run: pnpm test
      - name: Environment contract tests
        if: env.RUN_FRONTEND == 'true'
        run: pnpm test:env
      - name: CI routing and failure-guard tests
        if: env.RUN_FRONTEND == 'true'
        run: pnpm test:ci-plan
      - name: Component tests
        if: env.RUN_FRONTEND == 'true'
        run: pnpm test:ct
      - name: Production build
        if: env.RUN_FRONTEND == 'true'
        run: pnpm build
      - name: Upload failure evidence
        if: env.RUN_FRONTEND == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-failure
          path: |
            test-results/
            output/playwright/
          retention-days: 3
