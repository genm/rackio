name: Refresh PR license notices

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number whose generated notices should be refreshed
        required: true
        type: string
  # Dependency PRs cannot regenerate bundled notices themselves, so every
  # lockfile update fails the Security notice comparison until a maintainer
  # dispatches this workflow. A completed Security run instead selects the
  # blocked PR automatically; publication still leaves the PR in Draft for a
  # human ready-for-review decision, and generation never executes PR code.
  # Generation runs on the trusted default-branch checkout and only copies
  # dependency data from the PR; publication revalidates repository, base,
  # and head before pushing, so the elevated token never touches PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Security]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: refresh-license-notices-${{ inputs.pr || github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  select:
    name: Select the notice-blocked pull request
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Read the completed run's failed job and step names.
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.select.outputs.pr }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Pick the pull request blocked on license notices
        id: select
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        run: node scripts/refresh-pr-license-notices.mjs select

  generate:
    needs: select
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.select.outputs.pr != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr || needs.select.outputs.pr }}
    outputs:
      head: ${{ steps.target.outputs.head }}
      pr: ${{ steps.target.outputs.pr }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Resolve the exact PR commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/refresh-pr-license-notices.mjs resolve
      - name: Select the trusted Rust toolchain
        working-directory: automation
        run: rustup show
      - name: Copy dependency data into the trusted checkout
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.target.outputs.head }}
        run: node scripts/refresh-pr-license-notices.mjs prepare
      - name: Install pinned cargo-about
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.1
          fallback: none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Generate notices from the locked PR graphs
        working-directory: automation
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          mkdir -p "$RUNNER_TEMP/license-notices"
          scripts/generate-third-party-licenses.sh "$RUNNER_TEMP/license-notices/THIRDPARTY.html"
          node scripts/generate-javascript-licenses.mjs "$RUNNER_TEMP/license-notices/THIRDPARTY-JAVASCRIPT.html"
      - name: Pass only generated notices to the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-notices
          path: ${{ runner.temp }}/license-notices/THIRDPARTY*.html
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      PR_NUMBER: ${{ inputs.pr || needs.generate.outputs.pr }}
    steps:
      - name: Check out trusted publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Download this run's generated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name license-notices --dir "$RUNNER_TEMP/license-notices"
      - name: Update only notices if the PR has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.generate.outputs.head }}
          NOTICES_DIR: ${{ runner.temp }}/license-notices
        run: node automation/scripts/refresh-pr-license-notices.mjs publish
