[package]
name = "rackio-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately detached from the root workspace. `cargo-fuzz` builds these
# targets with a nightly toolchain and sanitizer flags that must not leak into
# the shipped workspace, and `libfuzzer-sys` generates `unsafe` code that the
# workspace lint policy denies.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.11"
tokio = { version = "1.53.1", features = ["io-util", "rt"] }
rackio-iroh = { path = "../crates/rackio-iroh" }
rackio-protocol = { path = "../crates/rackio-protocol" }

[[bin]]
name = "pairing_bundle"
path = "fuzz_targets/pairing_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metric_frame"
path = "fuzz_targets/metric_frame.rs"
test = false
doc = false
bench = false
