# pnpm's global virtual store cannot currently resolve the jest-dom -> Vitest
# peer from its hashed links layout. Keep the content-addressed store shared,
# but use a project-local virtual store so local tests and hooks match CI.
enableGlobalVirtualStore: false

packages:
  - apps/desktop

sharedWorkspaceLockfile: true
preferWorkspacePackages: true
minimumReleaseAge: 4320
# Exact exceptions for the dependency versions explicitly selected by the latest-stable upgrade.
minimumReleaseAgeExclude:
  - "@playwright/experimental-ct-core@1.62.0"
  - "@playwright/experimental-ct-react@1.62.0"
  - "es-toolkit@1.50.0"
  - "playwright-core@1.62.0"
  - "playwright@1.62.0"
  - "postcss@8.5.23"
  - "yargs@18.1.0"
allowBuilds:
  "@tauri-apps/cli": true
  esbuild: true
