# pnpm's global virtual store cannot currently resolve the jest-dom -> Vitest
# peer from its hashed links layout. Keep the content-addressed store shared,
# but use a project-local virtual store so local tests and hooks match CI.
enableGlobalVirtualStore: false

packages:
  - apps/desktop

sharedWorkspaceLockfile: true
preferWorkspacePackages: true
minimumReleaseAge: 4320
# Exact exceptions for the dependency versions explicitly selected by the latest-stable upgrade.
minimumReleaseAgeExclude:
  - "@playwright/experimental-ct-core@1.62.0"
  - "@playwright/experimental-ct-react@1.62.0"
  - "es-toolkit@1.50.0"
  - "playwright-core@1.62.0"
  - "playwright@1.62.0"
  - "postcss@8.5.23"
  - "yargs@18.1.0"
# Transitive advisories that their direct parents have not released a fix for.
# Each entry is the patched range from the advisory itself, so removing the
# parent's stale pin is enough to drop the override.
overrides:
  # GHSA-7p8r-x3mc-p8w7: host confusion via a backslash authority introducer,
  # reached through @commitlint/config-validator > ajv.
  fast-uri@>=3.0.0 <3.1.5: "^3.1.5"
  # GHSA-2v37-7h3g-55p8: custom generators loop indefinitely on size zero,
  # reached through vite > postcss.
  nanoid@<3.3.17: "^3.3.18"
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption resolving !!omap. The direct
  # devDependency is pinned to the patched release; this covers the copy
  # cosmiconfig resolves for @commitlint/load.
  js-yaml@>=4.0.0 <4.3.1: "4.3.1"
allowBuilds:
  "@tauri-apps/cli": true
  esbuild: true
