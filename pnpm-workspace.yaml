# pnpm's global virtual store cannot currently resolve the jest-dom -> Vitest
# peer from its hashed links layout. Keep the content-addressed store shared,
# but use a project-local virtual store so local tests and hooks match CI.
enableGlobalVirtualStore: false

packages:
  - apps/desktop

sharedWorkspaceLockfile: true
preferWorkspacePackages: true
minimumReleaseAge: 4320
# Exact exceptions for the dependency versions explicitly selected by the
# latest-stable upgrade. An entry is dead weight, not a live exception, once
# the resolved version in pnpm-lock.yaml moves past the pinned version here
# (#120); remove it at that point rather than letting it accumulate.
minimumReleaseAgeExclude:
  - "es-toolkit@1.50.0"
  - "yargs@18.1.0"
# Transitive advisories that their direct parents have not released a fix for.
# Each entry is the patched range from the advisory itself, so removing the
# parent's stale pin is enough to drop the override.
overrides:
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp: URI normalization and host confusion vulnerabilities,
  # reached through @commitlint/config-validator > ajv.
  fast-uri@>=3.0.0 <3.1.6: "^3.1.6"
  # GHSA-2v37-7h3g-55p8: custom generators loop indefinitely on size zero,
  # reached through vite > postcss.
  nanoid@<3.3.17: "^3.3.18"
  # GHSA-2883-xcg3-v3hh: empty YAML merge sources bypass the CPU limit.
  # The direct devDependency uses the patched 5.x release; this covers the
  # 4.x copy cosmiconfig resolves for @commitlint/load.
  js-yaml@>=4.0.0 <4.3.2: "4.3.2"
allowBuilds:
  "@tauri-apps/cli": true
  esbuild: true
